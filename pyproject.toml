[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx-patch-watch"
version = "0.1.0"
description = "Patch installation checker + multi-project dashboard for Magento/Commerce (ported from magento-security-watcher)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "packaging>=24.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
lpw = "lynx_patch_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lynx_patch_watch = [
  "web/templates/*.html",
  "web/templates/**/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
